name: handora

description: "Handora - artisan seller dashboard for ONDC."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Existing dependencies
  # Note: fonts are bundled as assets (see `fonts:` below) rather than fetched
  # at runtime by google_fonts — the app must render correctly offline.
  fl_chart: ^0.70.2
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  cupertino_icons: ^1.0.8

  # New: Camera + Supabase + AI
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # New: Voice assistant (record -> Gemini -> TTS)
  record: ^5.2.0
  flutter_tts: ^4.2.0

  # Shimmer loading effects
  shimmer: ^3.0.0

  # Network connectivity monitoring
  connectivity_plus: ^6.1.0

  # WhatsApp & URL launching
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Existing development dependencies
  sqflite_common_ffi: ^2.3.4+4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  # Bundled so the UI renders correctly on a first launch with no connectivity.
  # Both are variable fonts covering Thin..Black. Each is declared ONCE: since
  # Flutter 3.41, TextStyle.fontWeight drives the font's `wght` axis directly,
  # so per-weight entries are unnecessary. OFL licences ship alongside them.
  # https://docs.flutter.dev/release/breaking-changes/font-weight-variation
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
